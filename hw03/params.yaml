# Детерминированная учебная выборка из официальных файлов SQuAD 1.1.
collect:
  version: "v2"  # v1: 60 статей train; v2: те же 60 + 30 статей dev
  sources:
    v1:
      - "sources/train-v1.1.json"
    v2:
      - "sources/train-v1.1.json"
      - "sources/dev-v1.1.json"
  article_limits:
    train-v1.1.json: 60
    dev-v1.1.json: 30
  verify_answer_span: true
  system_prompts:
    - "Answer the question using only the supplied Wikipedia passage. Quote the shortest supported answer."
    - "Read the passage and answer the question with a text span found there. Add no outside facts."
    - "Find the answer in this Wikipedia excerpt. Keep the reply concise and grounded in the excerpt."
    - "Use the provided paragraph to answer the question. Return only the answer supported by that paragraph."
    - "Check the passage and give the exact answer to the question without speculation."

clean:
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4
    num_perm: 64
    threshold: 0.85
  pii:
    enabled: true

diversity:
  min_examples: 1000
  min_system_prompts: 3
  min_groups: 50
  max_group_share: 0.10
  min_answer_len_ratio: 1.6
  max_same_length_share: 0.25
  max_duplicate_answer_share: 0.30

split:
  group_key: "topic"  # topic = заголовок статьи Википедии
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"
  datasheet: "docs/datasheet.md"
