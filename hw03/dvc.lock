          sources:
            v1:
            - sources/train-v1.1.json
            v2:
            - sources/train-v1.1.json
            - sources/dev-v1.1.json
          article_limits:
            train-v1.1.json: 60
            dev-v1.1.json: 30
          verify_answer_span: true
          system_prompts:
          - Answer the question using only the supplied Wikipedia passage. Quote
            the shortest supported answer.
          - Read the passage and answer the question with a text span found 
            there. Add no outside facts.
          - Find the answer in this Wikipedia excerpt. Keep the reply concise 
            and grounded in the excerpt.
          - Use the provided paragraph to answer the question. Return only the 
            answer supported by that paragraph.
          - Check the passage and give the exact answer to the question without 
            speculation.
        paths.metrics_collect: metrics/collect.json
        paths.raw: data/raw.jsonl
