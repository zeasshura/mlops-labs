apiVersion: v1
kind: ServiceAccount
metadata: {name: monitor}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: hw11-monitor}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: hw11-monitor}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: hw11-monitor}
subjects: [{kind: ServiceAccount, name: monitor, namespace: hw11}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
{{ .Files.Get "files/prometheus.yml" | indent 4 }}
  rules.yml: |
{{ .Files.Get "files/rules.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: monitor
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.5.0
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2h, --storage.tsdb.retention.size=128MB, --storage.tsdb.path=/prometheus]
          ports: [{containerPort: 9090}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata:
      labels: {app: kube-state-metrics}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      serviceAccountName: monitor
      containers:
        - name: metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
          args: [--namespaces=hw11, "--resources=deployments,pods"]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 150m, memory: 64Mi}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-config}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: hw11-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: hw11
        options:
          path: /var/lib/grafana/dashboards
  dashboard.json: |
{{ .Files.Get "files/dashboard.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata:
      labels: {app: grafana}
      annotations:
        dashboard-sha: {{ .Files.Get "files/dashboard.json" | sha256sum | quote }}
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:12.1.1
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
          ports: [{containerPort: 3000}]
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 192Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/provider.yaml, subPath: provider.yaml}
            - {name: config, mountPath: /var/lib/grafana/dashboards/dashboard.json, subPath: dashboard.json}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: config
          configMap: {name: grafana-config}
        - name: data
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  selector: {app: grafana}
  ports: [{port: 3000}]
