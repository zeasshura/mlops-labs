groups:
  - name: hw11
    rules:
      - alert: HighFirstChunkLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(hw11_ttfc_seconds_bucket[30s]))) > 1 and sum(increase(hw11_ttfc_seconds_count[30s])) >= 10
        for: 15s
        labels: {severity: warning}
        annotations: {summary: "Simulated TTFC p95 above 1 second; at least 10 observations"}
      - alert: HighFailureFraction
        expr: sum(rate(hw11_requests_total{outcome=~"rejected|aborted|deadline"}[30s])) / sum(rate(hw11_requests_total[30s])) > 0.1 and sum(increase(hw11_requests_total[30s])) >= 10
        for: 15s
        labels: {severity: warning}
        annotations: {summary: "More than 10 percent unsuccessful attempts; at least 10 outcomes"}
