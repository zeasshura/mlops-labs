name: Fast HW08-10 checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw08-09-10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - run: make check
# This is a template. The submitted evidence is local; no remote CI/merge protection is claimed.
